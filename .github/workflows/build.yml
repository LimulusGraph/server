name: Build headless server

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
          - runner: macos-latest
            target: darwin
          - runner: windows-latest
            target: windows
    runs-on: ${{ matrix.runner }}
    env:
      LIMULUS_PYTHON: python
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          path: server
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: python -m pip install matplotlib pandas
      - name: Test on native operating system
        run: go test ./...
      - name: Package backend for amd64 and arm64
        run: python scripts/package.py --os ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: limulus-server-${{ matrix.target }}
          path: |
            server/release/*.tar.gz
            server/release/*.zip
            server/release/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: limulus-server-*
          path: release
          merge-multiple: true
      - name: Publish headless backend release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes
