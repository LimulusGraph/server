name: Build Limulus

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      client_ref:
        description: 'Optional client commit/tag/branch (defaults to .github/client-ref)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    outputs:
      client_sha: ${{ steps.client.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: server
          persist-credentials: false
      - name: Select client revision
        id: ref
        env:
          CLIENT_REF: ${{ inputs.client_ref }}
        run: echo "ref=${CLIENT_REF:-$(cat server/.github/client-ref)}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        id: client
        with:
          repository: LimulusGraph/client
          ref: ${{ steps.ref.outputs.ref }}
          path: client
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build browser editor
        working-directory: client
        run: |
          npm ci
          npm run build
          test -f ../server/web/dist/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: browser-bundle
          path: server/web/dist/
          if-no-files-found: error

  build:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
          - runner: macos-latest
            target: darwin
          - runner: windows-latest
            target: windows
    runs-on: ${{ matrix.runner }}
    env:
      LIMULUS_NO_BROWSER: '1'
      LIMULUS_PYTHON: python
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          path: server
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: browser-bundle
          path: server/web/dist
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: python -m pip install matplotlib pandas
      - name: Test on native operating system
        run: go test ./...
      - name: Package amd64 and arm64
        env:
          CLIENT_COMMIT: ${{ needs.frontend.outputs.client_sha }}
        run: python scripts/package.py --os ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: limulus-${{ matrix.target }}
          path: |
            server/release/*.tar.gz
            server/release/*.zip
            server/release/*.sha256
          if-no-files-found: error
